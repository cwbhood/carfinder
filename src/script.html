/* ---------- fuel cost, payment ---------- */
function monthlyPay(price, A){ const P = price*(1 - A.down/100); const r = A.apr/100/12; const n = A.term; if (r===0) return P/n; return P*r/(1-Math.pow(1+r,-n)); }
function fuelCost(c, A, cc){
  if (c.vt==='boat'){                                               // hours on the water × fuel burn at cruise; marine fuel runs ~15% dearer
    if (!A.hours || c.fuel==='Sail') return null;
    if (c.fuel==='EV') return c.kwh && c.rng ? A.hours*(c.kwh/4)*A.elec : null;     // a full pack lasts about four hours at cruise
    if (!c.gph) return null;
    const litres = c.gph*3.785*A.hours;
    if (cc==='US') return c.gph*A.hours*A.gas*1.15;
    return litres*(c.fuel==='Diesel' ? A.diesel : A.petrol)*1.15;
  }
  if (c.vt==='moto' && cc==='US' && c.fuel==='EV'){ const perMi = c.kwh && c.rng ? c.kwh/c.rng*1.12 : null; return perMi ? A.miles*perMi*A.elec : null; }
  if (cc==='US'){
    const m = A.miles;
    if (c.fuel==='EV') return c.mpge ? m/c.mpge*33.7*A.elec : null;
    if (c.fuel==='Hydrogen') return m*0.014*36;
    if (c.fuel==='PHEV'){ if (!c.mpg) return null; return (c.mpge ? m*0.55/c.mpge*33.7*A.elec : 0) + m*0.45/c.mpg*A.gas; }
    if (!c.mpg) return null; return m/c.mpg*(c.fuel==='Diesel' ? A.gas+0.45 : A.gas);
  }
  const km = cc==='UK' ? A.miles*1.609 : A.miles;
  const loss = cc==='CN' ? 1.25 : 1.12;                       // CLTC is optimistic
  const perKm = c.kwh && c.rng ? c.kwh/(cc==='US'?c.rng*1.609:c.rng)*loss : null;
  if (c.fuel==='EV') return perKm ? km*perKm*A.elec : null;
  const lp = c.fuel==='Diesel' ? A.diesel : c.fuel==='CNG' ? (A.cng||A.petrol) : A.petrol;
  if (c.fuel==='PHEV'){ if (!c.l100) return null; return (perKm ? km*0.5*perKm*A.elec : 0) + km*0.5/100*c.l100*lp; }
  if (!c.l100) return null;
  return km/100*c.l100*lp;
}

/* US-unit companions: every non-US figure carries a slash with its mpg / miles equivalent */
const usMpg = l100 => l100 ? Math.round(235.215/l100) : null;                 // US gallon
const usMi = km => km ? Math.round(km/1.609) : null;
function effShort(c, cc){
  if (c.vt==='boat'){
    if (c.fuel==='Sail') return 'Sail power'; if (c.fuel==='EV') return c.kwh ? c.kwh+' kWh battery' : 'Electric';
    if (!c.gph) return 'Fuel use not published';
    const us = cc==='US' || (cc==='ALL' && WUNIT==='mpg'); return us ? c.gph+' gal/h at cruise' : Math.round(c.gph*3.785)+' L/h / '+c.gph+' gal/h';
  }
  if (cc==='ALL'){
    const u = WUNIT; const mi = usMi(c.rng);
    const rangeTxt = u==='mpg' ? mi+' mi' : Math.round(c.rng)+' km / '+mi+' mi';
    if (c.fuel==='EV'||c.fuel==='Hydrogen') return rangeTxt+' range';
    const ice = !c.l100 ? 'hybrid' : u==='mpg' ? usMpg(c.l100)+' mpg' : u==='kml' ? (Math.round(100/c.l100*10)/10)+' km/L / '+usMpg(c.l100)+' mpg' : (Math.round(c.l100*10)/10)+' L/100km / '+usMpg(c.l100)+' mpg';
    if (c.fuel==='PHEV') return rangeTxt+' electric + '+ice;
    return c.l100 ? ice : 'Not rated';
  }
  if (cc==='US'){ if (c.fuel==='EV'||c.fuel==='Hydrogen') return c.rng+' mi range'; if (c.fuel==='PHEV') return c.rng+' mi electric + '+c.mpg+' mpg'; return c.mpg ? c.mpg+' mpg' : 'Not EPA-rated'; }
  if (cc==='IN'){ const ice = c.kmpl ? c.kmpl+' kmpl / '+usMpg(100/c.kmpl)+' mpg' : null; if (c.fuel==='EV') return c.rng+' km / '+usMi(c.rng)+' mi range'; if (c.fuel==='PHEV') return c.rng+' km / '+usMi(c.rng)+' mi electric + '+(ice||'hybrid'); return ice || 'Not rated'; }
  const u = EFF_UNIT[cc];
  const ice = !c.l100 ? null : u==='mpg' ? Math.round(282.48/c.l100)+' mpg UK / '+usMpg(c.l100)+' mpg US' : u==='kml' ? (Math.round(100/c.l100*10)/10)+' km/L / '+usMpg(c.l100)+' mpg' : c.l100+' L/100km / '+usMpg(c.l100)+' mpg';
  const rangeTxt = cc==='UK' ? usMi(c.rng)+' mi' : c.rng+' km / '+usMi(c.rng)+' mi';
  if (c.fuel==='EV') return rangeTxt+' range';
  if (c.fuel==='PHEV') return rangeTxt+' electric + '+(ice||'hybrid');
  return ice || 'Not rated';
}

function motoEffScale(cfg, cc){             // bikes are two to three times thriftier than cars, so the sliders go further
  const e = cfg.eff; const u = e.unit;
  if (u==='mpg'){ e.max = cc==='UK' ? 150 : 130; e.step = 5; } else if (u==='kmpl'){ e.max = 80; e.step = 5; } else if (u==='L/100km'){ e.max = 8; e.step = 0.25; } else if (u==='km/L'){ e.max = 60; e.step = 2; }
  e.hint = e.hint.replace(/^[^;]*;/, 'petrol bikes;');
  cfg.rng = Object.assign({}, cfg.rng, {max: cfg.rng.unit==='mi' ? 200 : 300, step: cfg.rng.unit==='mi' ? 5 : 10});
}
function boatEff(cc, usUnits){ const us = usUnits===undefined ? cc==='US' : usUnits; return us
  ? {mode:'max', label:'Max fuel use (gal/h at cruise)', hint:'gas & diesel; sail and electric always pass', max:30, step:1, unit:'gal/h', sort:'Lowest fuel use', get:c=>c.gph}
  : {mode:'max', label:'Max fuel use (L/h at cruise)', hint:'gas & diesel; sail and electric always pass · 20 L/h ≈ 5.3 gal/h', max:110, step:5, unit:'L/h', sort:'Lowest fuel use', get:c=>c.gph?c.gph*3.785:null}; }
function boatLen(){ return {mode:'min', label:'Minimum length', hint:'overall length', max:40, step:1, unit:'ft', get:c=>c.len}; }
function scalePresets(cc, vt, base, K){
  const f = VERT[vt].presetScale[cc]!==undefined ? VERT[vt].presetScale[cc] : 1; const cv = v => v ? sig2(v*f) : 0;
  return base.map(([a,b]) => [cv(a), cv(b), !a ? 'Under '+K.k(cv(b)) : !b ? K.k(cv(a))+'+' : K.range(cv(a), cv(b))]);
}
function assumeFor(cc, vt){
  const base = COUNTRIES[cc].assume; const out = {};
  Object.entries(base).forEach(([k,v]) => out[k] = v.slice());
  if (vt==='car' || !Object.keys(base).length) return out;
  const V = VERT[vt].assume;
  if (vt==='moto'){ if (out.miles) out.miles = [out.miles[0], Math.round(out.miles[1]*V.distMult/500)*500, out.miles[2]]; }
  else { delete out.miles; out.hours = ['Engine hours per year', V.hours, 5]; }
  if (out.apr) out.apr = [out.apr[0], Math.round((out.apr[1]+V.aprAdd)*10)/10, out.apr[2]];
  if (out.term) out.term = [out.term[0], V.term, out.term[2]]; if (out.down) out.down = [out.down[0], V.down, out.down[2]];
  return out;
}

function countryConfig(cc, vt){
  const base = COUNTRIES[cc]; const V = VERT[vt];
  const c = Object.assign({}, base, {vt, bodyOrder:V.bodyOrder, bodyLabel:V.bodyLabel, bodyPlural:V.bodyPlural, fuelOrder:V.fuelOrder, sizeLabel:V.sizeLabel, seatsLabel:V.seatsLabel, seatsOpts:V.seatsOpts, driveLabel:V.driveLabel, driveOpts:V.driveOpts, driveTest:V.driveTest, wizardUseLabels:V.wizardUseLabels, rangeSort:V.rangeSort, clsLabel:V.clsLabel||{Mainstream:'Mainstream',Luxury:'Luxury',Exotic:'Exotic'}});
  c.eff = Object.assign({}, base.eff); c.rng = Object.assign({}, base.rng); c.assume = assumeFor(cc, vt);
  if (vt==='car'){ c.wizardUseLabels = Object.assign({}, V.wizardUseLabels, {work: base.wizardWork}); return c; }
  const K = MONEY[cc];
  c.lede = V.lede(cc); c.title = base.title; c.sizes = V.sizes; c.fuelLabel = Object.assign({}, FUEL_LABEL_G, V.fuelLabel||{});
  c.otdLabel = V.otd[cc] || V.otdDefault; c.otdSub = V.otdSub; c.trimWord = V.trimWord;
  if (cc==='AU' && vt==='moto'){ c.cardPriceLabel = 'Ride-away'; c.priceLabel = 'Ride-away price (A$)'; }
  if (cc==='IN'){ c.priceUnit = 1; c.priceInputLabel = '₹'; c.priceLabel = 'Ex-showroom price (₹)'; }
  c.presets = scalePresets(cc, vt, base.presets, K);
  c.wizardBudgets = base.wizardBudgets.map(([v,l]) => [v ? sig2(v*(V.presetScale[cc]!==undefined ? V.presetScale[cc] : 1)) : 0, v ? 'Under '+K.k(sig2(v*(V.presetScale[cc]!==undefined ? V.presetScale[cc] : 1))) : 'No limit']);
  for (let i = 1; i < c.wizardBudgets.length; i++){ if (c.wizardBudgets[i][0] && c.wizardBudgets[i-1][0]) c.wizardBudgets[i][1] = K.range(c.wizardBudgets[i-1][0], c.wizardBudgets[i][0]); }
  c.budgetShare = V.budgetShare; c.wizardFuels = V.wizardFuels; c.wizardAwd = V.wizardAwd; c.wizardYes = V.wizardYes; c.wizardNo = V.wizardNo; c.learnerSizes = V.learnerSizes; c.wizardUse = V.wizardUse; c.wizardWork = V.wizardUseLabels.work;
  if (vt==='moto'){ motoEffScale(c, cc); }
  else { c.eff = boatEff(cc); c.rng = boatLen(); }
  return c;
}
function regionsFor(cc){
  if (cc==='ALL') return Object.keys(FX).filter(k=>k!=='USD').map(k=>[k, `${CUR_NAME[k]} (${k})`]);

function regionDefault(cc){ return cc==='US' ? 'US' : cc==='IN' ? 'IN' : REGION_DEFAULT[cc]; }
function regionOf(c){ return regionDefault(c.cc); }
function regionName(cc, code){ if (cc==='ALL') return 'prices in '+CUR_NAME[WCUR]; if (cc==='US') return usState(code).name; if (cc==='IN') return inState(code).name; return (REGIONS[cc][code]||REGIONS[cc][REGION_DEFAULT[cc]])[0]; }
/* World tab: price presets and wizard budgets follow the chosen currency (rounded to two significant figures) */
const WORLD_PRESETS_USD = [[0,20000],[20000,35000],[35000,50000],[50000,80000],[80000,0]];
function sig2(x){ if (!x) return 0; const m = Math.pow(10, Math.floor(Math.log10(x)) - 1); return Math.round(x/m)*m; }
function worldPresets(){
  const cv = v => sig2(v*FX[WCUR]); const K = MONEY.ALL;
  const f = VERT[VT].presetScale ? (VERT[VT].presetScale.ALL||1) : 1; const cs = v => sig2(v*FX[WCUR]*f);
  C.presets = WORLD_PRESETS_USD.map(([a,b]) => [cs(a), cs(b), !a ? 'Under '+K.k(cs(b)) : !b ? K.k(cs(a))+'+' : K.range(cs(a), cs(b))]);
  C.wizardBudgets = [[20000*f,'Under '+K.k(cs(20000))],[35000*f,K.range(cs(20000),cs(35000))],[50000*f,K.range(cs(35000),cs(50000))],[80000*f,K.range(cs(50000),cs(80000))],[0,'No limit']];
  C.priceInputLabel = WCUR; C.priceLabel = 'List price ('+WCUR+')';
}

const GLOSS = {
  US: [['MSRP / sticker price','The manufacturer’s suggested retail price. It is a starting point, not the law. Dealers can sell above or below it.'],['Destination charge','A fixed shipping fee every buyer pays on top of MSRP, usually $1,100 to $2,200. It is printed on the window sticker and is not negotiable.'],['Trim','The equipment level. A base trim is the cheapest version; higher trims add features and thousands of dollars. This page shows the base-to-top spread.'],['Market adjustment / dealer markup','Extra money a dealer adds above sticker on high-demand models. Legal, but negotiable, and another dealer may not charge it.'],['Incentives and rebates','Money the manufacturer takes off the price, or cheap financing, to move slow-selling models. They change monthly and are listed on the brand’s website.'],['Doc fee','A dealer’s paperwork fee. Some states cap it (California $85, New York $175); others let dealers charge $800 or more. Ask about it before you agree on a price.'],['Out-the-door / drive-off price','Everything you pay: vehicle price, destination, dealer fees, sales tax, title and registration. Always negotiate on this number, not the monthly payment.'],['Hybrid','A gas engine helped by a small battery you never plug in. Better mpg, especially in town, with no change in how you fuel it.'],['Plug-in hybrid (PHEV)','A hybrid with a bigger battery you charge at home. Drives 20 to 55 miles on electricity, then runs as a normal hybrid, so there is no range worry.'],['EV range','How far an electric car goes on a full charge under the EPA test. Expect 10% to 30% less in winter or at highway speeds.'],['MPGe','Miles per gallon equivalent. How far an EV goes on the energy in one gallon of gas (33.7 kWh). Higher means cheaper to run.'],['AWD vs 4WD','Both send power to all four wheels. AWD works automatically and suits snow and rain; 4WD is the heavier truck-style system for off-road use.'],['Leftover model year','Last year’s model still sitting new on a lot. Dealers discount them heavily, especially when the model was discontinued.']],
  IN: [['Ex-showroom price','The price the manufacturer publishes, including GST. It is what the dealer bills you for the car itself, before road tax, insurance and registration.'],['On-road price','Ex-showroom plus RTO road tax, registration, insurance, TCS and any accessories. This is the number you actually pay, so negotiate on it, not on the EMI.'],['Road tax (RTO)','A one-time state tax, usually 6% to 18% of ex-showroom, that varies by state, price slab and fuel. Karnataka, Kerala and Tamil Nadu are highest; Gujarat lowest. Most states waive it for EVs.'],['GST slabs (since 22 Sept 2025)','18% on small cars (petrol up to 1.2 L or diesel up to 1.5 L, under 4 m long), 40% on everything bigger, 5% on electric cars.'],['TCS (1%)','Tax Collected at Source on cars above ₹10 lakh. The dealer collects 1% and deposits it against your PAN; you adjust it against your income tax.'],['Insurance','Dealers bundle one year of comprehensive cover with three years of third-party cover. Dealer quotes are often 20% to 40% above the same policy online.'],['Handling / logistics charges','A fee some dealers add at delivery. Courts have ruled it illegal to charge separately; ask for it to be removed.'],['Sub-4m','Cars under 4 metres long qualify for the 18% GST slab if the engine is small enough. That is why so many Indian SUVs and sedans are exactly 3.99 m.'],['kmpl (ARAI mileage)','Kilometres per litre from the ARAI test cycle. Real-world city figures run 15% to 25% lower. For CNG the figure is km per kg.'],['CNG','Factory CNG cars cost about ₹1 lakh more and lose boot space, but run at roughly half the per-km cost of petrol.'],['Strong hybrid','A petrol engine plus a battery that can move the car on its own at low speeds. No plug; 25 to 28 kmpl in the Grand Vitara, Hyryder and Victoris.'],['Waiting period','Popular models are sold before they are built. Booking at more than one dealer is common.'],['BH series registration','Bharat-series plates for government, PSU and multi-state company employees; road tax paid every two years and the car moves between states without re-registration.'],['Bharat NCAP / Global NCAP','Crash-test ratings out of five stars. Most new Tata, Mahindra, Skoda-VW, Hyundai and Kia models score four or five.']],
  CN: [['指导价 (guide price)','The manufacturer’s list price including 13% VAT and consumption tax. Every site quotes it; almost nobody pays it on a petrol car.'],['裸车价 (bare-car price)','What you actually pay the dealer for the car after discount, before tax, insurance and plates. Get it in writing.'],['落地价 (on-road price)','Bare-car price plus purchase tax, insurance, registration and, in Shanghai, the plate auction. The number to compare across dealers.'],['购置税 (purchase tax)','10% of the ex-VAT price. NEVs pay half (5%) in 2026-27, with the reduction capped at ¥15,000, so cars over ¥339,000 save exactly ¥15,000.'],['交强险 / 商业险','Compulsory third-party insurance (¥950 a year) and the optional commercial policy every financed car needs (¥2,500 to ¥7,000 in year one).'],['绿牌 / 蓝牌','Green NEV plate versus the blue plate for petrol, diesel and hybrid cars. Green plates dodge most city restrictions and, in most cities, cost nothing.'],['拍牌 / 摇号','Plate auction (Shanghai, Guangzhou, Shenzhen, Hangzhou, Tianjin) or lottery (Beijing). A Shanghai plate cost about ¥94,000 in September 2026.'],['以旧换新 (trade-in subsidy)','National scheme paying 6% to 12% of the new car’s price (capped at ¥13,000 to ¥20,000) when you scrap or trade in an old car. Paid to your bank account afterwards.'],['CLTC','China’s official EV range cycle. Optimistic: expect 65% to 80% of the figure in real use, less in winter.'],['增程 (EREV)','Range-extender EV: electric drive with a petrol generator (Li Auto, AITO, Leapmotor). Taxed and plated like a plug-in hybrid.'],['DM-i / EM-i / Hi4 / C-DM','BYD, Geely, Great Wall and Chery plug-in hybrid systems. 亏电油耗 is the fuel use with a flat battery, the honest number.'],['4S店 vs 直营','Franchised dealer (negotiate hard) versus a brand-run store with fixed prices (Tesla, Xiaomi, NIO, Li Auto, AITO).'],['BaaS','NIO/Onvo battery-as-a-service: buy the car without the battery and rent it monthly.'],['金融服务费 / 出库费','Dealer finance-service and release fees. Not statutory; refuse them.']],
  UK: [['OTR (on the road)','The all-in price you drive away for: VAT, delivery, plates, the £55 registration fee and first-year road tax. The only price to compare.'],['List price / P11D','The manufacturer’s price with VAT but without the £55 fee and first-year VED. Used for the £40k/£50k supplement test, the £37k grant cap and company-car tax.'],['VED (road tax)','A CO2-based first-year charge inside the OTR price, then £200 a year from year two.'],['Expensive Car Supplement','An extra £440 a year in years two to six for cars listed over £40,000 (£50,000 for EVs). Options can tip a car over the line.'],['Electric Car Grant','£1,500 or £3,750 the dealer takes off an eligible sub-£37,000 EV from a maker on the scheme. Tesla, BYD, MG and most Chinese brands are not on it.'],['BIK (benefit-in-kind)','The income tax a company-car driver pays on a percentage (4% EV to 37% thirsty petrol) of the P11D value.'],['PCP','Pay a deposit and 3 to 4 years of monthly payments, then pay the balloon to keep the car, hand it back, or trade in.'],['GFV / balloon','The Guaranteed Future Value at the end of a PCP: what you pay to own it outright.'],['PCH (leasing)','A straight lease; you never own the car. Usually the cheapest monthly route into an EV.'],['Target Price / Carwow price','The realistic discounted price brokers achieve, usually 5% to 15% under OTR.'],['Pre-reg car','A brand-new car the dealer has already registered to hit targets, sold 15% to 30% off as "used" with a few miles on it.'],['Plate change (26 / 76 plate)','New registration letters on 1 March and 1 September; the fortnights before each quarter-end are the best time to haggle.'],['WLTP','The official lab test behind the mpg, CO2 and range figures. Real-world EV range is typically 10% to 25% lower.'],['NCB','No-claims bonus: years without an insurance claim. It is why young or new drivers pay so much more.']],
  AU: [['RRP / before on-roads','The manufacturer’s list price including GST and Luxury Car Tax but excluding stamp duty, rego, CTP, plates and dealer delivery.'],['Drive-away','The total you hand over: RRP plus all on-road costs for your postcode. Advertised drive-away deals usually waive dealer delivery.'],['On-road costs (ORC)','Stamp duty + registration + CTP + plates + dealer delivery, typically 5% to 8% of RRP.'],['Stamp duty','A one-off state tax on the purchase price, 2% to 9% depending on the state, price, engine and emissions.'],['Rego','The annual state registration fee. It includes CTP everywhere except NSW, where the green slip is bought separately.'],['CTP / green slip / TAC','Compulsory third-party injury insurance, named differently in each state. It does not cover damage to cars.'],['LCT (Luxury Car Tax)','33% on the part of the price above A$80,809 (A$91,661 for cars using 3.5 L/100 km or less). Already inside the RRP; utes are exempt.'],['Dealer delivery','A dealer fee of A$1,500 to A$3,000 for preparing the car. Negotiable; ask for it to be waived first.'],['Novated lease','A salary-packaging lease through your employer. EVs under A$91,661 are FBT-exempt, which cuts the real cost 20% to 40%.'],['NVES','The New Vehicle Efficiency Standard: fleet CO2 targets that fine makers A$100 per gram over. It is why hybrids and EVs get cheaper and V8s dearer.'],['ADR 81/02 fuel figure','The official combined L/100 km on the windscreen label. Real use is 15% to 30% higher.'],['ANCAP','The local five-star crash rating; some fleets require 5 stars.'],['Run-out','Stock of a model being replaced, sold at a discount. Check the build date: a 2025-built car is worth less at trade-in.'],['Cab-chassis vs pick-up','Ute body styles; cab-chassis prices exclude the tray (A$1,500 to A$4,000).']],
  MX: [['Precio de lista','The brand’s published price; already includes IVA and ISAN; excludes placas, tenencia and insurance.'],['IVA','16% value-added tax, inside every list price.'],['ISAN','Federal new-car tax of 2% to 17% on the pre-tax price, hidden in the list price. Cars under about MX$414,000, all EVs and all hybrids pay none.'],['Tenencia','Annual state ownership tax, 3% of the pre-IVA value, depreciating each year. Abolished in half the states and subsidised for cars under MX$638,000 in CDMX and Edomex.'],['Refrendo','The yearly plate-renewal fee (MX$700 to MX$4,100 by state) paid January to March. Paying on time unlocks the tenencia subsidy.'],['Alta de placas / tarjeta de circulación','First registration and the registration card: MX$972 in CDMX, MX$1,194 in Edomex, within 30 days.'],['Verificación / holograma','The twice-yearly emissions test in the Megalópolis; 00 = new car exempt two years, E = electric or hybrid exempt forever.'],['Hoy No Circula','The weekday driving ban by plate digit in CDMX and Edomex; holograms 00, 0 and E are exempt.'],['Enganche','Down payment, usually 10% to 20%.'],['CAT','Costo Anual Total: the all-in annualised cost of a loan (interest, fees, insurance), typically 19% to 26%. Compare this, not the rate.'],['Bono / precio especial','Manufacturer or dealer cash discount, often conditional on financing with the captive lender.'],['Cobertura amplia / limitada','Comprehensive versus theft-and-liability insurance; lenders require amplia.'],['Gestoría','The dealer’s paperwork fee for plating the car; optional and negotiable.'],['Rendimiento (km/L)','Fuel economy from the CONUEE Ecovehículos label; 20 km/L = 5.0 L/100 km.']],
  ES: [['PVP recomendado / tarifa','The manufacturer’s list price including IVA and impuesto de matriculación, before campaign discounts.'],['Precio promocional / campaña','The advertised price after brand and dealer discounts, usually conditional on financing or a trade-in.'],['Impuesto de matriculación','One-off registration tax of 0 / 4.75 / 9.75 / 14.75% of the ex-IVA price by WLTP CO2 band; lower in Canarias, zero in Ceuta and Melilla.'],['IVA / IGIC / IPSI','21% on the Península and Baleares; Canarias uses IGIC (9.5% / 15%, 0% for EVs); Ceuta and Melilla use the lower IPSI.'],['IVTM / impuesto de circulación','Annual town-hall tax by caballos fiscales, €20 to €224 a year, 50% to 75% off for CERO/ECO cars in most cities.'],['Etiqueta DGT (0 / ECO / C / B)','The environmental sticker that decides ZBE access, parking discounts and tax bonuses. CERO for EVs and long-range PHEVs, ECO for hybrids and gas.'],['ZBE','The low-emission zone every city over 50,000 people must run. No-label cars are already banned in Madrid and Barcelona; B labels are next.'],['Plan Auto+','The 2026 state EV/PHEV aid of up to €4,500, paid by IDAE after purchase, with a €45,000 ex-tax price cap and a mandatory €1,000 dealer discount.'],['Deducción IRPF del 15%','Income-tax credit of 15% of the price (base up to €20,000, so up to €3,000) for an electrified car bought by 31 Dec 2026.'],['Tasa DGT y gestoría','The €99.77 registration fee plus €100 to €300 for the agent who files the paperwork; dealers bill them as gastos de matriculación.'],['Descuento por financiación','An extra discount granted only if you take the brand’s loan for a minimum amount and term.'],['Km 0','A car already registered by the dealer (0 to 500 km) sold at a big discount; you are the second owner on paper.'],['Cuota final / valor futuro garantizado','PCP-style finance with low monthly payments and a large final balloon.'],['TIN vs TAE','Nominal rate versus the all-in annual rate including fees; always compare TAE.']],
  RU: [['РРЦ (recommended price)','The maker\u2019s list price including 20% VAT; every discount is quoted from it and imported cars carry the utilisation fee and duty inside it.'],['Выгода / прямая скидка','The direct discount the maker or dealer gives anyone; often 5% to 15% of the РРЦ.'],['Скидка по трейд-ин / по кредиту','Extra discounts only if you trade in a car or finance through the captive bank; the 0.01% rate is paid for inside the price.'],['Допы','Dealer-installed extras (mats, film, alarm) the salesman bundles; illegal to force, hard to avoid on hot models, 30,000 to 500,000 ₽.'],['Утильсбор','The recycling fee every importer pays per car, 0.8 to 2.5 M ₽ on imported models and rising every January; refunded to Russian plants.'],['Госпрограмма (льготный автокредит)','State programme paying 20% (25% in the Far East) of the price on a loan for eligible buyers of Russian-built cars, 35% up to 925,000 ₽ for Russian-built EVs.'],['ОСАГО','Compulsory third-party insurance you must hold to register; 6,000 to 12,000 ₽ a year for a typical driver, more in Moscow and Chelyabinsk.'],['КАСКО','Optional comprehensive cover; banks require it on financed cars; 3.5% to 7% of value a year.'],['Транспортный налог','Annual regional tax per horsepower, billed the following year; from 0 ₽/hp in Sverdlovsk to 150 ₽/hp for 250+ hp cars.'],['Повышающий коэффициент','The ×3 transport-tax multiplier for cars on the 10 M ₽+ list.'],['Госпошлина / ГИБДД / СТС / ЭПТС','The 4,500 ₽ state duty for registration, the registration card and the electronic vehicle passport.'],['КБМ','Your no-claims class in ОСАГО: 1.17 for a new driver, 0.46 after about 10 clean years.'],['Параллельный импорт','Grey import of brands with no official importer (Toyota, BMW, Zeekr): no factory warranty, full utilisation fee; not listed here.'],['Локализация','Localisation points a Russian-assembled model needs for utilisation-fee refunds and state-loan eligibility.']],
  BR: [['Preço público sugerido / tabela','The brand\u2019s published São Paulo price with IPI, PIS/COFINS, ICMS and frete inside; the ceiling you negotiate down from.'],['Bônus de fábrica / preço promocional','The manufacturer\u2019s monthly cash discount (R$5,000 to R$50,000) that the dealer must pass on.'],['Venda direta (CNPJ, PcD, taxista)','Direct-sales channels 10% to 30% under retail; PcD and taxi buyers also get IPI and ICMS exemptions.'],['IPI Verde / Carro Sustentável','The federal excise inside the price, 0% to 20% by fuel, power and efficiency; 0% for national 1.0 compacts through 2026.'],['ICMS','State VAT (12% on cars in São Paulo and most states), inside the price and the reason it differs by state.'],['Emplacamento','First registration, Mercosul plates and the despachante: R$700 to R$1,700 in fees, R$1,500 to R$3,500 if the dealer does it.'],['IPVA','Annual state ownership tax, 1.9% to 4% of the invoice value, prorated in the purchase year; several states exempt EVs and São Paulo exempts flex hybrids.'],['Licenciamento anual','The yearly Detran renewal (R$120 to R$300) paid with the IPVA.'],['Tabela FIPE','The monthly reference value of every model, used for IPVA, insurance and trade-ins.'],['Flex / regra dos 70%','Almost every Brazilian-built car burns any mix of petrol and ethanol; ethanol is cheaper per km when it costs less than 70% of petrol.'],['PBEV / INMETRO','The official efficiency label (km/L for petrol and ethanol, range for EVs).'],['CDC / entrada / CET / IOF','The standard car loan, the down payment (20% to 30%), the total effective cost of the loan and the 0.38%-plus-daily federal tax on credit.'],['Consórcio','A savings pool that delivers a car without interest but with a 12% to 20% admin fee and no fixed date.'],['Supervalorização do usado','The dealer\u2019s inflated trade-in offer used instead of a cash discount.']],
  CA: [['MSRP / PDSF','The manufacturer\u2019s sticker before freight, fees and taxes.'],['Freight & PDI','The manufacturer\u2019s fixed delivery and pre-delivery charge (C$1,850 to C$4,000), added to every sale and taxed.'],['All-in price','What Ontario, Quebec, BC, Alberta, Manitoba and Saskatchewan dealers must advertise: MSRP plus freight and every fee, before sales tax and registration.'],['A/C tax and green levy','The C$100 federal excise on air conditioning and the C$1,000 to C$4,000 levy on cars rated 13 L/100 km or worse (pickups exempt).'],['Luxury tax','Federal tax on vehicles over C$100,000: the lesser of 10% of the price or 20% of the amount above C$100,000, with sales tax on top.'],['HST / GST / PST / QST','Harmonised tax in Ontario (13%) and the Atlantic provinces (14% to 15%); the 5% federal GST plus provincial taxes elsewhere; BC\u2019s PST climbs to 20% on expensive cars.'],['EVAP','The federal Electric Vehicle Affordability Program: C$5,000 for a BEV or C$2,500 for a PHEV at the dealer on vehicles under C$50,000 all-in, one per person, 2026 to 2030.'],['Roulez vert','Quebec\u2019s EV rebate (C$2,000 BEV / C$1,000 PHEV), ending 31 Dec 2026.'],['Counter-tariff','Canada\u2019s 25% surtax on US-assembled vehicles, remitted for makers with Canadian plants; Chinese-built EVs pay 6.1% inside a 49,000-unit quota.'],['Admin / doc fee','The dealer\u2019s own paperwork charge (C$199 to C$999), negotiable and inside all-in prices.'],['ICBC / MPI / SGI / SAAQ','The public insurance schemes of BC, Manitoba, Saskatchewan and (injury only) Quebec, bought with the plate.'],['NRCan rating','Canada\u2019s official fuel-consumption and range figures, on every window sticker.'],['Residual / km allowance','Leasing terms: the buy-back price and the 16,000 to 24,000 km-a-year cap.'],['CUSMA-compliant','A vehicle meeting the North American content rules; only its non-Canadian/Mexican share carries the counter-tariff.']],
  ALL: [['Converted price','Each car\u2019s home-market list price converted at ECB reference rates of 29 September 2026 (rubles at the market rate). Currency moves change the ranking, not the cars.'],['Why the same car costs different amounts','Taxes inside the sticker differ (18% to 40% GST in India, up to 50% excise in Thailand, 35% import duty in Brazil), as do freight, dealer margins and what equipment comes standard.'],['Est. on-road','Computed with the car\u2019s home-market rules for its default region (Ontario, São Paulo, Moscow, Shanghai excluded, NSW and so on), then converted.'],['Purchasing power','A car can be cheap in dollars but expensive locally: an Alto K10 is US$3,900 in India, where the average income is a tenth of the US figure.'],['Efficiency units','Pick mpg (US), L/100 km or km/L in the filter panel; EV range shows in miles with mpg and in km otherwise. Home-market test cycles differ (EPA, WLTP, CLTC, NEDC), so ranges are not perfectly comparable.'],['Price per horsepower','The list price divided by peak power, a quick value screen for performance buyers; it ignores weight, gearbox and drivetrain.'],['Fuel cost','Yearly running cost at the home market\u2019s fuel and electricity prices and typical annual distance, converted.'],['Preliminary','Announced or estimated pricing that can still change; imported and luxury models are the most common cases.'],['Grey imports','Cars only available as parallel imports (Toyota in Russia, VW in Thailand) are not listed; every row has an official importer or plant.']],
  TH: [['ราคาป้าย (list price)','The brand’s published retail price; already includes excise, interior tax and VAT.'],['ภาษีสรรพสามิต (excise tax)','The big hidden tax, 2% to 50% of the pre-VAT price by CO2 and technology: 2% for EV3.5 electric cars, 13% to 34% for petrol cars, 25% for PPVs.'],['CBU / CKD','Fully imported (duty up to 80% from Japan and Europe, 0% from China) versus assembled in Thailand. That is why a Forester costs ฿2.6 m.'],['Eco Sticker','The government fuel-economy label (km/L, CO2) every new car carries; source of the efficiency figures.'],['PPV','Pickup passenger vehicle: a 7-seat SUV on a pickup chassis (Fortuner, MU-X, Everest, Pajero Sport). Taxed at 18% to 25%.'],['EV3.5','The 2024-27 government EV package: 2% excise plus a ฿25,000 to ฿50,000 subsidy already deducted from participating brands’ stickers. Expires end of 2027.'],['ป้ายแดง (red plate)','Temporary dealer plate used for up to 30 days until your white plate arrives.'],['ภาษีรถประจำปี (annual tax)','The yearly road-tax sticker, ฿900 to ฿7,000 by engine size (weight for pickups and EVs).'],['พ.ร.บ. (por-ror-bor)','Compulsory third-party injury insurance, ฿645 for a car, sold with the annual tax. Separate from voluntary insurance.'],['ประกันชั้น 1 / 2+ / 3+','First-class (comprehensive), 2+ and 3+ voluntary insurance. Finance companies require first class while you owe money.'],['ดาวน์ / ฟรีดาวน์','Down payment / zero-down deal. Thai loans are hire-purchase: the finance company owns the car until the last instalment.'],['ดอกเบี้ยคงที่ (flat rate)','Adverts quote a flat rate; the true effective rate is about 1.8 to 1.9 times higher (2.99% flat ≈ 5.5%).'],['ของแถม (freebies)','Dealer extras that replace cash discounts: film, insurance, mats, wall-box. Always ask for their cash value.'],['Motor Show / Motor Expo','The Bangkok shows (March-April and December) where launch prices and the year’s best finance deals appear.']]

const ABOUT = {
  US: `<h2>How these numbers work</h2><p><b>Sticker (MSRP)</b> is the manufacturer’s base price for each model’s cheapest trim through its most expensive, before the mandatory destination charge. Prices are the 2026 model year as published by the manufacturers, compiled September 29, 2026, with 2025 leftovers and early 2027 models included and labeled. Models marked <i>preliminary</i> use announced or expected pricing that can still change.</p><p><b>Estimated drive-off</b> starts from the sticker plus destination, applies a typical dealer discount or markup for that model’s demand level (in August 2026 incentives averaged about 6.6% of MSRP industry-wide, with far larger EV incentives), then adds your state’s sales tax, a typical dealer documentation fee, and roughly $350 for title and plates. Local tax rates, dealer add-ons and negotiation change the real number, so treat it as a range to bargain within.</p><p><b>Fuel economy</b> is the EPA combined rating for the most efficient common configuration; electric range is the EPA figure for the longest-range trim. The federal $7,500 EV tax credit ended September 30, 2025; some states and utilities still offer EV rebates.</p>`,
  IN: `<h2>How these numbers work</h2><p><b>Ex-showroom</b> is the manufacturer’s published price, GST included, for each model’s cheapest variant through its most expensive, as listed on September 29, 2026 after the September 2025 GST cut (18% on small cars, 40% on larger ones, 5% on EVs). Models marked <i>preliminary</i> use announced, expected or imported-model pricing that can still change.</p><p><b>Estimated on-road</b> applies a typical dealer discount for that model’s demand, then adds your state’s RTO road tax by price slab and fuel type, about ₹3,000 for registration, HSRP plates and FASTag, a first-year comprehensive insurance estimate, and 1% TCS on cars above ₹10 lakh. Accessories, extended warranty and any “handling charges” are extra and negotiable.</p><p><b>Mileage</b> is the ARAI-claimed figure for the most efficient common variant; EV range is the manufacturer’s claimed figure for the biggest battery. Road-tax slabs change with state budgets and several EV waivers have expiry dates, so confirm the on-road quote with two or three dealers.</p>`,
  CN: `<h2>How these numbers work</h2><p><b>Guide price (厂商指导价)</b> is the manufacturer’s list price including 13% VAT and consumption tax, for each model’s cheapest trim through its most expensive, as listed on Autohome in late September 2026. CLTC range is quoted; expect 65% to 80% of it in real use.</p><p><b>Estimated 落地价</b> applies the discount typical for that model (the price war has joint-venture petrol cars and German luxury 15% to 35% below list, while hot NEVs sell at list), then adds purchase tax (10% of the ex-VAT price; 5% for NEVs in 2026-27 with the reduction capped at ¥15,000), compulsory and commercial insurance, registration and, for your city, a plate: Shanghai auctions ICE and PHEV plates (about ¥94,000 in September 2026) and gives BEVs a free green plate; Beijing allocates plates by lottery and points; Guangzhou, Shenzhen, Hangzhou and Tianjin auction petrol plates for ¥1,500 to ¥12,000 and give NEVs free ones; every other city charges only the ¥150 registration.</p><p>The national trade-in subsidy (6% to 12% of the price, capped at ¥13,000 to ¥20,000) is paid to you afterwards and is shown but not subtracted.</p>`,
  UK: `<h2>How these numbers work</h2><p><b>OTR price</b> is the manufacturer’s on-the-road price (VAT, delivery, plates, £55 registration and first-year road tax included) for each model’s cheapest trim through its most expensive, as published on brand sites, Carwow and What Car? in September 2026, before the Electric Car Grant. Pickups are shown VAT-inclusive.</p><p><b>Estimated drive-away</b> applies the discount brokers and dealers typically achieve for that model (0% to 2% on waiting-list cars, 5% to 8% on most, 12% to 25% on EVs over £37k, Stellantis brands and pre-registered stock), then takes off the Electric Car Grant (£1,500 or £3,750) where the maker is on the scheme and the trim lists under £37,000. Taxes are identical across England, Scotland, Wales and Northern Ireland; the only regional variable is insurance.</p><p>Road tax from year two is £200, plus £440 a year in years two to six for cars listed over £40,000 (£50,000 for EVs). mpg, CO2 and range are WLTP figures.</p>`,
  AU: `<h2>How these numbers work</h2><p><b>RRP</b> is the manufacturer’s recommended retail price before on-road costs (GST and any Luxury Car Tax included) for each model’s cheapest grade through its most expensive, from carsguide, Drive, CarExpert and brand sites in September 2026. Brands that publish only drive-away prices are converted and marked <i>preliminary</i>.</p><p><b>Estimated drive-away</b> applies the discount typical for that model (Toyota and Tesla at RRP; A$1,000 to A$3,000 off most; 6% to 15% off Chinese brands, diesel utes and run-out stock), adds a typical dealer delivery fee (negotiable), your state or territory’s stamp duty on the dutiable value, and 12 months of registration, CTP and plates. Comprehensive insurance is shown but not included.</p><p>Fuel figures are the ADR combined L/100 km on the windscreen label; range is WLTP where the brand quotes it. September 2026 fuel prices (unleaded about A$2.35, diesel about A$2.80) reflect the mid-year oil shock.</p>`,
  MX: `<h2>How these numbers work</h2><p><b>Precio de lista</b> is the brand’s published price, IVA and ISAN included, for each model’s cheapest versión through its most expensive, from brand sites and Autocosmos in September 2026. Promotional “precios especiales” tied to financing are noted, not used.</p><p><b>Estimated precio final</b> applies the discount typical for that model (nothing on Versa, Hilux or RAV4; MX$10,000 to MX$30,000 bonos on most; 6% to 15% on Chinese brands and slow sellers), then adds your state’s alta de placas, the holograma for Megalópolis states, and first-year tenencia where it still applies (3% of the pre-IVA value in CDMX and Edomex above MX$638,000; EVs and hybrids exempt). Comprehensive insurance is shown but not included.</p><p>Rendimiento comes from the CONUEE Ecovehículos label; EV range is as published by the brand (NEDC/CLTC for Chinese brands, EPA for Tesla, GM and Ford). Cars built in China carry a 50% import tariff since January 2026, absorbed so far by the brands.</p>`,
  ES: `<h2>How these numbers work</h2><p><b>PVP</b> is the manufacturer’s tarifa oficial including IVA 21% and the impuesto de matriculación, for each model’s cheapest versión through its most expensive, from km77 and brand tariffs in September 2026, before campaign discounts (Toyota’s advertised promo prices are 10% to 15% below its tariff, so Toyota looks dearer here than in adverts).</p><p><b>Estimated precio final</b> applies the discount typical for that model (0% to 3% on Dacia and hot launches, 4% to 9% on most, 10% to 20% on Toyota promos, Stellantis campaigns, Tesla and km-0 stock), then adds matriculación costs (DGT fee, plates, gestoría) and the prorated first-year IVTM. Canarias prices are recomputed with IGIC instead of IVA; Ceuta and Melilla with IPSI. Plan Auto+ (up to €4,500, paid after purchase) and the 15% IRPF deduction are shown for CERO-label cars but not subtracted.</p><p>Consumption, CO2 and range are WLTP figures.</p>`,
  RU: `<h2>How these numbers work</h2><p><b>Recommended price (РРЦ)</b> is the maker\u2019s list price with 20% VAT, for each model\u2019s cheapest trim through its most expensive, from official price lists and Russian portals in late September 2026, before the advertised benefits. Only brands with an official importer or plant are listed; parallel imports (Toyota, BMW, Kia) are not. Imported cars carry the utilisation fee and 15% duty inside the price.</p><p><b>Estimated drive-away</b> applies the benefits typical for that model (0% to 3% on waiting-list cars, 5% to 10% on most, 12% to 25% on imported stock), adds a typical dealer add-on package, the 4,500 ₽ registration duty and a first-year ОСАГО premium for your region. КАСКО, the transport tax billed next year and the state loan discount are shown but not included.</p><p>Consumption is the maker\u2019s combined figure; EV range is NEDC or CLTC as published. Fuel prices are the 29 September 2026 national averages.</p>`,
  BR: `<h2>How these numbers work</h2><p><b>Preço de tabela</b> is the brand\u2019s published São Paulo price with IPI, PIS/COFINS, ICMS and frete inside, for each model\u2019s cheapest versão through its most expensive, from Webmotors and brand launch pricing in late September 2026 (model year 2027 where already on sale). Rio prices run about 1.5% higher.</p><p><b>Estimated preço final</b> applies the bonus typical for that model (nothing on Polo, Onix, HB20 or Toyota hybrids; 3% to 7% on most; 8% to 20% on Stellantis SUVs, imported EVs and 2025-plate stock), then adds your state\u2019s emplacamento and first-year IPVA (prorated for a late-September purchase, with each state\u2019s EV and hybrid rules). There is no compulsory insurance in 2026; comprehensive cover is shown but not included.</p><p>km/L is the INMETRO petrol figure; ethanol returns about 30% less per litre but is cheaper per km when it costs under 70% of petrol, as in São Paulo now.</p>`,
  CA: `<h2>How these numbers work</h2><p><b>MSRP</b> is the manufacturer\u2019s Canadian sticker before freight, fees and taxes, for each model\u2019s cheapest trim through its most expensive, from brand sites, Unhaggle and AutoTrader in late September 2026 (2027 model year where already on sale). Brands that only publish all-in prices are backed out and marked <i>preliminary</i>.</p><p><b>Estimated drive-away</b> applies the discount typical for that model, then adds the brand\u2019s freight & PDI, the A/C tax, tire and admin fees, the green levy and federal luxury tax where they apply, your province\u2019s sales tax (BC\u2019s price-tiered PST included), registration, and takes off the federal EVAP rebate and any provincial EV rebate. Insurance is shown but not included.</p><p>Consumption and range are NRCan ratings. September 2026 fuel prices reflect the Gulf shock (diesel at a record C$2.64) and the suspended federal excise tax.</p>`,
  ALL: `<h2>How the World view works</h2><p>Every car from the eleven country tabs in one list. <b>List price</b> is the home-market sticker converted at ECB reference rates of 29 September 2026 (USD 1.1355, GBP 0.857, INR 108.99, CNY 7.61, AUD 1.62, MXN 20.32, THB 38.06, BRL 5.92, CAD 1.61 per euro; rubles at 73.5 per dollar). <b>Est. on-road</b> is computed with each car\u2019s home rules for its default region and converted the same way.</p><p>Prices are not directly comparable across borders: stickers include very different taxes (5% to 40% GST in India, 2% to 50% excise in Thailand, 35% import duty in Brazil, VAT in Europe, nothing in the US and Canada), and equipment, warranties and safety kit differ. Use this view to spot outliers and value, then read the car\u2019s home tab for what it really costs there.</p><p>Efficiency is shown in the unit you pick; EV ranges come from different test cycles (EPA, WLTP, CLTC, NEDC) and CLTC figures run about 20% optimistic.</p>`,
  TH: `<h2>How these numbers work</h2><p><b>Retail price (ราคาป้าย)</b> is the brand’s published price including excise, interior tax and 7% VAT, for each model’s cheapest grade through its most expensive, from brand sites and Thai portals in September 2026. Chinese-brand list prices move every few months and their promo prices are often 5% to 10% below the row.</p><p><b>Estimated on-road</b> applies the discount typical for that model (nothing on waiting-list cars; freebies worth 1% to 3% on Japanese mainstream; 8% to 15% on run-outs and the EV price war), then adds DLT registration, the first year’s annual tax (by engine size, weight for pickups and EVs; the 80% EV discount expired in November 2025), พ.ร.บ. compulsory insurance and a typical dealer processing fee. Taxes are national, so there is no region to pick. First-class insurance is shown but not included since financed cars often get it free.</p><p>km/L and CO2 are Eco Sticker figures; EV range is NEDC for most Chinese, Japanese and Korean EVs and WLTP for Tesla and the Europeans. E20 gasohol is the default petrol price.</p>`
};

const GLOSS_V = {
  moto: [['List / ride-away price','What the brand publishes for the bike. In Australia and some UK adverts that already includes registration and delivery (ride-away or OTR); in the US, Canada and India it does not, so freight, setup, tax and plates come on top.'],['Freight & setup / PDI','The crate-to-showroom shipping plus the dealer\u2019s assembly and pre-delivery inspection. Printed on the quote, rarely negotiable on hot models, often waived on slow ones.'],['Engine size (cc)','Cylinder displacement. Under 125 cc is the learner and city class almost everywhere; 300 to 650 cc is the mid-weight sweet spot; litre-class bikes (1,000 cc+) need an unrestricted licence.'],['Learner licence (A1 / A2 / LAMS / CBT)','Most countries let new riders start on bikes up to 125 cc, then a power-limited class (35 kW in Europe, LAMS in Australia) before an unrestricted licence. Check the row note for the class.'],['Twist-and-go','Scooters with a CVT automatic: no clutch, no gears. The reason Vespa, PCX and NMAX dominate city sales.'],['ABS','Anti-lock brakes, mandatory on new bikes over 125 cc in Europe, India and many other markets; the single most important safety option on a motorcycle.'],['Ride-away / out-the-door','Everything you pay before you ride off: the bike, freight, setup, sales or registration tax, plates and compulsory insurance. Negotiate on this number.'],['Compulsory insurance','Third-party cover you must hold to register (CTP in Australia, พ.ร.บ. in Thailand, ОСАГО in Russia, third-party in India and the UK). Full cover on a new sportbike can cost several times more; get quotes before you buy.'],['kmpl / mpg','Fuel economy; small bikes return 40 to 70 km per litre (100 to 160 mpg), litre-class bikes 15 to 20 km per litre. Every figure here carries its US-unit twin.'],['Electric scooter range','The claimed range on a full charge, usually a city cycle; expect 70% to 85% of it in mixed riding. Home charging costs a fraction of petrol per kilometre.']],
  boat: [['MSRP / package price','The brand\u2019s published price. In the US and Canada many boats are priced as a boat-motor-trailer (BMT) package; others list the hull alone and the engine is extra. The row note says which.'],['Freight & prep / commissioning','Shipping from the factory plus rigging, fluids, battery and sea trial. Typically 3% to 6% of the price, charged on top in North America, often inside the price in Europe.'],['Outboard / sterndrive / inboard / jet','Where the engine lives. Outboards hang off the transom (easy to service, most fishing boats), sterndrives sit inside with a drive unit through the transom (runabouts), inboards are fully inside (wake boats), jets have no propeller (jet skis, jet boats).'],['Length overall (LOA)','Hull length in feet; registration fees, slip rents and towing rules scale with it. Boats over about 26 ft are hard to trailer behind a normal car.'],['Capacity plate','The maximum persons and weight the hull is rated for; printed on a plate inside the boat and enforced on the water.'],['Hull types','Deep-V hulls cut chop (center consoles, bowriders); flat and pontoon hulls are stable and shallow (fishing, pontoons); planing wake hulls make the biggest wave.'],['Gallons per hour (gph)','Fuel use at cruise with the standard engine. A 150 hp outboard burns about 6 to 7 gph at 25 knots; multiply by your hours on the water for the fuel bill.'],['Registration / titling','Most countries register boats over a size or power threshold with a state, provincial or maritime authority; fees scale with length and the sticker is renewed every year or three.'],['Trailer','Usually a separate purchase or an option (US$1,500 to US$6,000) and separately registered. Check the tow rating of your car against the boat-motor-trailer weight.'],['Boating licence','Many places require a boating safety certificate or licence above a horsepower or length threshold (PCOC in Canada, state cards in the US, PER/PNB in Spain, boat licences in Australian states).'],['Slip, mooring, storage','Keeping a boat at a marina costs more than the loan payment on many boats; trailer boats avoid it. Shown as information, not added.']]
};
const ABOUT_V = {
  moto: cc => `<h2>How these numbers work</h2><p><b>List price</b> is the maker\u2019s published price for each model\u2019s cheapest variant through its most expensive, on the basis used locally (${cc==='US'||cc==='CA' ? 'MSRP before freight and setup' : cc==='UK' ? 'OTR, with VAT, delivery, registration and first-year VED inside' : cc==='AU' ? 'ride-away where the brand publishes it, RRP plus typical on-road costs otherwise' : cc==='IN' ? 'ex-showroom, GST included' : 'the brand\u2019s retail price with taxes inside'}), compiled in early October 2026. Rows marked <i>preliminary</i> use estimated or unconfirmed pricing.</p><p><b>Estimated ride-away</b> applies the discount typical for that model\u2019s demand, then adds freight and setup where they are charged, the sales, purchase or road tax for your region, registration and plates, and the compulsory insurance where it is bought with the bike. Full insurance is shown as information. Dealer-fitted extras and accessories are not included.</p><p><b>Fuel economy</b> is the maker\u2019s or the official combined figure; electric range is the claimed figure for the biggest battery. Licence classes, learner restrictions and city bans are noted per model where they matter.</p>`,
  boat: cc => `<h2>How these numbers work</h2><p><b>List price</b> is the brand\u2019s published price for each model\u2019s cheapest standard package through its most expensive, compiled in early October 2026. In ${cc==='US'||cc==='CA'||cc==='AU' ? 'this market many boats are priced as boat-motor-trailer packages and others as a hull with the engine extra; the note on each row says which' : 'this market the price normally includes the standard engine; trailers, electronics and canvas are extra'}. Rows marked <i>preliminary</i> use estimated or unconfirmed pricing.</p><p><b>Estimated on-the-water</b> applies the discount typical for that model, then adds freight and dealer preparation where they are charged, the sales or purchase tax for your region (with the caps some places apply to boats), registration and titling, and the compulsory insurance where any exists. Trailer registration, slips, mooring and full insurance are shown as information.</p><p><b>Fuel use</b> is a typical cruise figure in gallons or litres per hour for the standard engine; the yearly fuel estimate multiplies it by the engine hours you set in the cost assumptions.</p>`
};
function glossFor(cc, vt){ if (vt==='car') return GLOSS[cc]; const extra = ((VFEES[cc]||{})[vt]||{}).glossary || []; return GLOSS_V[vt].concat(extra); }
function aboutFor(cc, vt){ return vt==='car' ? ABOUT[cc] : ABOUT_V[vt](cc); }

/* ===== state ===== */
let VT = 'car', CC = 'US', C = countryConfig('US', 'car'), CARS = DATA.car.US, M = MONEY.US, A = {};
const S = {};
let compare = [], page = 1, lastList = []; const PAGE = 30;
const $ = id => document.getElementById(id);
function store(k,v){ try{ localStorage.setItem('cf_'+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ const v = localStorage.getItem('cf_'+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } }
function esc(s){ return String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function resetS(){ Object.assign(S, {q:'', body:new Set(), fuel:new Set(), size:new Set(), cls:new Set(), make:new Set(), countries:new Set(), pmin:0, pmax:0, seats:0, drive:'any', eff:0, rng:0, years:{2025:true,2026:true,2027:true}, onlyNew:false, est:true, sort:'price-asc'}); }
resetS();
const money = n => M.money(n), moneyK = n => M.k(n);
function fuelLbl(f){ return C.fuelLabel[f] || f; }
const P = c => CC==='ALL' ? c.wprice : c.price;
const TOP = c => CC==='ALL' ? c.wtop : c.top;
const DEF_A_CACHE = {}; function DEFA(cc, vt){ const k = vt+'/'+cc; return DEF_A_CACHE[k] || (DEF_A_CACHE[k] = defA(cc, vt)); }
function annualFuel(c){ if (CC==='ALL'){ const f = fuelCost(c.home, DEFA(c.cc, VT), c.cc); return f==null ? null : toWorld(f, c.cc); } return fuelCost(c, A, CC); }
function bd(c, price){
  if (CC!=='ALL') return breakdown(CC, c, price, S.state, M);
  const o = breakdown(c.cc, c.home, price, regionDefault(c.cc), MONEY[c.cc]);
  return Object.assign(o, {lo:toWorld(o.lo, c.cc), hi:toWorld(o.hi, c.cc), dlo:toWorld(o.dlo, c.cc), dhi:toWorld(o.dhi, c.cc), head:`${CC_NAME[c.cc]} · ${o.head} · in ${CUR[c.cc]}`});
}
function trimPrice(c, t){ return c.price + (c.top - c.price)*(t||0); }
function rngShown(c){ if (CC==='ALL') return WUNIT==='mpg' ? c.rng/1.609 : c.rng; return CC==='UK' ? c.rng/1.609 : c.rng; }
function localM(c){ return CC==='ALL' ? MONEY[c.cc] : M; }

/* ===== filtering ===== */
function passes(c){
  if (CC==='US' && VT==='car' && !S.years[c.year]) return false;
  if (!(CC==='US' && VT==='car') && S.onlyNew && !c.isNew) return false;
  if (!S.est && c.est) return false;
  if (S.q){ const hay = (c.make+' '+c.model+' '+c.fuels.map(fuelLbl).join(' ')+' '+(C.bodyLabel[c.body]||c.body)).toLowerCase(); for (const t of S.q.split(/\s+/)) if (t && !hay.includes(t)) return false; }
  if (S.body.size && !S.body.has(c.body)) return false;
  if (S.fuel.size && !c.fuels.some(f => S.fuel.has(f))) return false;
  if (S.size.size && !S.size.has(c.size)) return false;
  if (S.cls.size && !S.cls.has(c.cls)) return false;
  if (S.make.size && !S.make.has(c.make)) return false;
  if (S.countries.size && !S.countries.has(c.cc)) return false;
  if (S.pmin && TOP(c) < S.pmin) return false;
  if (S.pmax && P(c) > S.pmax) return false;
  if (S.seats && c.seats < S.seats) return false;
  if (S.drive!=='any' && C.driveTest[S.drive] && !C.driveTest[S.drive](c)) return false;
  if (S.eff && !(c.fuel==='EV'||c.fuel==='Hydrogen'||c.fuel==='Sail')){ const e = C.eff.get(c); if (C.eff.mode==='min' ? !(e && e >= S.eff) : !(e && e <= S.eff)) return false; }
  if (S.rng){ const v = C.rng.get ? C.rng.get(c) : (c.rng ? rngShown(c) : null); if (!(v && v >= S.rng)) return false; }
  return true;
}
function sortList(list){
  const fc = {}; const fuel = c => { if (!(c.id in fc)) fc[c.id] = annualFuel(c); return fc[c.id]; };
  const effv = c => { const e = C.eff.get(c); return e==null ? null : e; };
  const cmp = {
    'price-asc': (a,b)=>P(a)-P(b),
    'price-desc':(a,b)=>P(b)-P(a),
    'fuel': (a,b)=>{ const x=fuel(a), y=fuel(b); if (x==null&&y==null) return P(a)-P(b); if (x==null) return 1; if (y==null) return -1; return x-y; },
    'mpg': (a,b)=>{ const x=effv(a), y=effv(b); if (x==null&&y==null) return P(a)-P(b); if (x==null) return 1; if (y==null) return -1; return (C.eff.mode==='min' ? y-x : x-y) || P(a)-P(b); },
    'range': (a,b)=>{ const rv = c => C.rng.get ? (C.rng.get(c)||0) : (c.fuel==='PHEV'?0:(c.rng||0)); const x=rv(a), y=rv(b); return y-x || P(a)-P(b); },
    'hp': (a,b)=>b.hp-a.hp || P(a)-P(b),
    'perhp': (a,b)=>P(a)/(a.hp||1e-6) - P(b)/(b.hp||1e-6),
    'seats': (a,b)=>b.seats-a.seats || P(a)-P(b),
    'name': (a,b)=>(a.make+a.model).localeCompare(b.make+b.model)
  }[S.sort] || ((a,b)=>P(a)-P(b));
  return list.slice().sort(cmp);
}
function activeCount(){
  let n = 0;
  if (S.size.size) n++; if (S.cls.size) n++; if (S.make.size) n++; if (S.countries.size) n++; if (S.pmin||S.pmax) n++; if (S.seats) n++; if (S.drive!=='any') n++; if (S.eff) n++; if (S.rng) n++;
  if (CC==='US' && VT==='car' && !(S.years[2025]&&S.years[2026]&&S.years[2027])) n++; if (!(CC==='US' && VT==='car') && S.onlyNew) n++; if (!S.est) n++;
  return n;
}

/* ===== rendering ===== */
function lenTxt(c){ return c.len ? `${c.len} ft / ${Math.round(c.len*0.3048*10)/10} m` : ''; }
function specsHTML(c){
  const hp = `<span><b>${c.hp.toLocaleString()}</b> ${C.powerUnit}</span>`;
  if (c.vt==='moto') return `<span class="eff">${effShort(c, CC)}</span>${c.ccm ? `<span><b>${c.ccm}</b> cc</span>` : (c.kwh ? `<span><b>${c.kwh}</b> kWh</span>` : '')}${hp}<span>${esc(c.drive)}</span>`;
  if (c.vt==='boat') return `<span class="eff">${lenTxt(c)}</span>${c.hp ? hp : '<span><b>Sail</b> only</span>'}<span><b>${c.seats}</b> people</span><span>${esc(c.drive)}</span><span>${effShort(c, CC)}</span>`;
  return `<span class="eff">${effShort(c, CC)}</span>${hp}<span><b>${c.seats}</b> seats</span><span>${esc(c.drive)}</span>`;
}
/* photos: a Wikimedia Commons image per vehicle when one is known (data/images.json), otherwise a body-type silhouette */
/* Wikimedia only serves thumbnail widths it has already rendered; the 960 px rendition exists for every file here
   because the index was built through the API, and files smaller than that are served as the original */
function thumbUrl(f){ const enc = s => encodeURIComponent(s).replace(/[!'()*]/g, ch => '%'+ch.charCodeAt(0).toString(16).toUpperCase()); const base = 'https://upload.wikimedia.org/wikipedia/'+(f[1]==='e' ? 'en' : 'commons'); if (f[5]==='o') return base+'/'+f[2][0]+'/'+f[2]+'/'+enc(f[0]); const ext = f[0].toLowerCase().split('.').pop(); const tail = '960px-'+f[0]+(ext==='svg' ? '.png' : (ext==='tif'||ext==='tiff') ? '.jpg' : ''); return base+'/thumb/'+f[2][0]+'/'+f[2]+'/'+enc(f[0])+'/'+enc(tail); }
function imgRec(c){
  const h = c.home || c; const m = (IMAGES.map || {})[h.vt+'/'+h.cc]; const r = m && m[h.make+'|'+h.model]; if (!r) return null;
  const f = IMAGES.files[r[0]]; if (!f) return null;
  return {file:f[0], url:thumbUrl(f), artist:f[3], license:f[4], approx:r[1]};
}
function photoHTML(c, where){
  const r = imgRec(c); const big = where==='detail';
  const sil = `<svg class="sil" viewBox="0 0 160 90" aria-hidden="true"><use href="#sil-${silKey(c)}"></use></svg>`;
  if (!r) return `<div class="photo ph-none ${big?'big':''}">${sil}</div>`;
  const onerr = "this.closest('.photo').classList.add('ph-none');this.remove()";   // back to the silhouette if Commons is unreachable
  return `<div class="photo ${big?'big':''}"><img src="${esc(r.url)}" alt="${esc(c.make+' '+c.model)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="${onerr}">${sil}${big ? '' : `<span class="credit" title="${esc('Photo: '+(r.artist||'Wikimedia Commons')+(r.license?' · '+r.license:''))}">${esc(r.license||'CC')}</span>`}</div>`;

/* ===== compare ===== */
function toggleCompare(id){
  const i = compare.indexOf(id);
  if (i>=0) compare.splice(i,1);
  else { if (compare.length>=4){ toast('Compare holds four at a time. Remove one first.'); return; } compare.push(id); }
  store(cmpKey(), compare);
  document.querySelectorAll(`[data-cmp="${id}"]`).forEach(b => { const on = compare.includes(id); b.setAttribute('aria-pressed', on); b.textContent = on ? '✓ Comparing' : '+ Compare'; });
  updateCmpBar();
}
function cmpKey(){ return VT==='car' ? 'cmp_'+CC : 'cmp_'+VT+'_'+CC; }

    <tbody>

  $('countryTabs').addEventListener('click', e => { const b = e.target.closest('.ctab'); if (b && b.dataset.country!==CC){ switchCountry(b.dataset.country); window.scrollTo({top:0}); } });
  $('state').addEventListener('change', e => { S.state = e.target.value; store('state_'+CC, S.state); if (CC==='ALL'){ WCUR = S.state; worldPrices(); worldPresets(); refreshPriceUI(); S.pmin = 0; S.pmax = 0; syncChips(); } render(); if (detailCar && $('dlgDetail').open) renderDetail(); });
  // phones: the state picker gets its own row under the sticky search bar; wider screens keep it in the toolbar
  const mqPhone = matchMedia('(max-width:639px)'), mqWide = matchMedia('(min-width:960px)');
  const placeState = () => { (mqPhone.matches ? $('stateRow') : $('toolbar')).appendChild($('stateWrap')); };
  placeState(); mqPhone.addEventListener('change', placeState);
  $('countryOpts').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; const v=b.dataset.v; if (S.countries.has(v)) S.countries.delete(v); else S.countries.add(v); syncChips(); page=1; render(); });
  $('wunit').addEventListener('change', e => { WUNIT = e.target.value; store('wunit', WUNIT); applyWorldUnits(); applySliders(); S.eff = 0; S.rng = 0; syncChips(); page=1; render(); });
  $('makes').addEventListener('change', e => { const v=e.target.value; if (e.target.checked) S.make.add(v); else S.make.delete(v); page=1; render(); });
  $('clearMakes').addEventListener('click', () => { S.make.clear(); syncChips(); page=1; render(); });
  let qt; $('q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(()=>{ S.q = e.target.value.trim().toLowerCase(); page=1; render(); }, 150); });
  $('q').addEventListener('keydown', e => { if (e.key==='Enter') e.target.blur(); });   // Enter dismisses the phone keyboard
  $('sort').addEventListener('change', e => { S.sort = e.target.value; page=1; render(); });
  $('bodyChips').addEventListener('click', e => { const b = e.target.closest('[data-body]'); if (!b) return; const v=b.dataset.body; if (v==='') S.body.clear(); else if (S.body.has(v)) S.body.delete(v); else S.body.add(v); syncChips(); page=1; render(); });
  $('fuelChips').addEventListener('click', e => { const b = e.target.closest('[data-fuel]'); if (!b) return; const v=b.dataset.fuel; if (v==='') S.fuel.clear(); else if (S.fuel.has(v)) S.fuel.delete(v); else S.fuel.add(v); syncChips(); page=1; render(); });
  $('sizeOpts').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; const v=b.dataset.v; if (S.size.has(v)) S.size.delete(v); else S.size.add(v); syncChips(); page=1; render(); });
  $('clsOpts').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; const v=b.dataset.v; if (S.cls.has(v)) S.cls.delete(v); else S.cls.add(v); syncChips(); page=1; render(); });
  const priceChange = () => { S.pmin = Math.max(0, (parseFloat($('pmin').value)||0)*C.priceUnit); S.pmax = Math.max(0, (parseFloat($('pmax').value)||0)*C.priceUnit); page=1; render(); };
  $('pmin').addEventListener('change', priceChange); $('pmax').addEventListener('change', priceChange);
  $('clearPrice').addEventListener('click', () => { S.pmin=0; S.pmax=0; syncChips(); page=1; render(); });
  $('pricePresets').addEventListener('click', e => { const b = e.target.closest('[data-min]'); if (!b) return; S.pmin = +b.dataset.min; S.pmax = +b.dataset.max; syncChips(); page=1; render(); });
  $('seats').addEventListener('change', e => { S.seats = +e.target.value; page=1; render(); });
  $('drive').addEventListener('change', e => { S.drive = e.target.value; page=1; render(); });
  $('mpg').addEventListener('input', e => { S.eff = +e.target.value; $('mpgOut').textContent = effOut(S.eff); page=1; renderSoon(); });
  $('rng').addEventListener('input', e => { S.rng = +e.target.value; $('rngOut').textContent = rngOut(S.rng); page=1; renderSoon(); });
  ['y2025','y2026','y2027'].forEach(id => $(id).addEventListener('change', e => { S.years[+id.slice(1)] = e.target.checked; page=1; render(); }));
  $('onlyNew').addEventListener('change', e => { S.onlyNew = e.target.checked; page=1; render(); });
  $('showEst').addEventListener('change', e => { S.est = e.target.checked; page=1; render(); });
  $('resetAll').addEventListener('click', () => { resetS(); $('q').value=''; syncChips(); page=1; render(); });
  const openF = () => { $('filters').classList.add('open'); document.body.classList.add('no-scroll'); $('btnFilters').setAttribute('aria-expanded','true'); $('filters').scrollTop = 0; };
  const closeF = () => { $('filters').classList.remove('open'); document.body.classList.remove('no-scroll'); $('btnFilters').setAttribute('aria-expanded','false'); };
  $('btnFilters').addEventListener('click', openF);
  $('closeFilters').addEventListener('click', closeF); $('applyFilters').addEventListener('click', closeF);
  mqWide.addEventListener('change', e => { if (e.matches) closeF(); });          // rotating a tablet to the wide layout must not leave the page scroll-locked
  document.addEventListener('keydown', e => { if (e.key==='Escape' && $('filters').classList.contains('open')) closeF(); });
  $('btnMore').addEventListener('click', () => { page++; renderMore(); });
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { if (es.some(x=>x.isIntersecting) && !$('moreRow').hidden && page*PAGE < 150) { page++; renderMore(); } }, {rootMargin:'600px 0px'}).observe($('moreRow'));
  $('grid').addEventListener('click', e => {
    const d = e.target.closest('[data-detail]'); if (d) { openDetail(+d.dataset.detail); return; }
    const c = e.target.closest('[data-cmp]'); if (c) { toggleCompare(+c.dataset.cmp); return; }
    const card = e.target.closest('.card'); if (card && !e.target.closest('button,a')) openDetail(+card.dataset.id);   // the whole card is a tap target on phones
  });
  // back to top after a long scroll
  let ttRaf = 0; addEventListener('scroll', () => { if (ttRaf) return; ttRaf = requestAnimationFrame(() => { ttRaf = 0; $('toTop').classList.toggle('show', scrollY > 1200); }); }, {passive:true});
  $('toTop').addEventListener('click', () => scrollTo({top:0, behavior:'smooth'}));
  $('btnCompare').addEventListener('click', openCompare);
  $('btnClearCmp').addEventListener('click', () => { compare = []; store(cmpKey(), compare); render(); });
  document.querySelectorAll('dialog').forEach(d => { d.addEventListener('click', e => { if (e.target.closest('[data-close]')) d.close(); else if (e.target === d) d.close(); }); });
  $('btnGloss').addEventListener('click', () => $('dlgGloss').showModal());
  $('btnWizard').addEventListener('click', () => $('dlgWizard').showModal());
  // ?v=moto&cc=IN deep links (the site's demo buttons use them)
  const qs = new URLSearchParams(location.search); const qv = qs.get('v'), qc = (qs.get('cc')||'').toUpperCase();
  if (VERT[qv] || COUNTRIES[qc]) setLive(COUNTRIES[qc] ? qc : CC, VERT[qv] ? qv : VT);
  $('countryTabs').innerHTML = countryTabsHTML();
  buildChrome(); syncChips(); render();
}
init();
</script>
